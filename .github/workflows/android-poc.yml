name: Android Shell PoC

# A single source on main powers both the web and packaged Android app.
# Historical standalone PoC jobs were retired; the native regression tests remain.
on:
  workflow_dispatch:
    inputs:
      sign_internal:
        description: Sign the main release bundle for Play internal testing
        type: boolean
        default: false
      highest_play_version_code:
        description: Highest versionCode ever used in Play Console (0 only for confirmed first upload)
        required: false
        type: string
        default: ""
  pull_request:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/android-poc.yml"
      - "components/**"
      - "lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "app/globals.css"
      - "public/**"

jobs:
  android-packaged-guest-step9:
    # Bundles actual first-party Byeolharu React UI, no remote WebView, no live account.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 40
    env:
      BYEOLHARU_POC_PACKAGED_GUEST: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Verify shared web/native boundary before packaging
        run: node --test mobile/scripts/check-shared-web-boundary.test.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify Android SDK
        run: |
          test -n "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Install first-party web dependencies
        run: pnpm install --frozen-lockfile
      - name: Install locked Android dependencies
        run: npm ci --no-audit --no-fund
        working-directory: mobile
      - name: Verify Android checks and package actual guest UI
        run: |
          npm run check
          npm run packaged-guest:build
          npm run packaged-guest:verify
          test -s www-packaged-guest/app.js
          test -s www-packaged-guest/app.css
        working-directory: mobile
      - name: Install Chromium for packaged guest startup smoke test
        run: pnpm exec playwright install --with-deps chromium
      - name: Prove bundled React UI mounts without fatal browser errors
        run: node mobile/scripts/smoke-packaged-guest.mjs
      - name: Upload startup failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: byeolharu-packaged-guest-startup-debug
          path: mobile/www-packaged-guest/startup-failure.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Generate Android project
        run: npm run android:init
        working-directory: mobile
      - name: Sync bundled guest UI
        run: npm run android:sync
        working-directory: mobile
      - name: Compile packaged guest APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: mobile/android
      - name: Test native cold reminder identity against the shared planner
        run: node mobile/scripts/test-cold-reminder-native-key.mjs
      - name: Inspect compiled LocalNotifications API for cold widget transport
        run: node mobile/scripts/inspect-cold-reminder-native-api.mjs
      - name: Assert compiled APK includes Android reboot receiver and notification permissions
        run: node mobile/scripts/check-guest-boot-manifest.mjs
      - name: Verify compiled debug APK identity, version, SDK and embedded source
        run: node mobile/scripts/check-android-artifact.mjs apk mobile/android/app/build/outputs/apk/debug/app-debug.apk "$ANDROID_HOME/build-tools/36.0.0/aapt"
      - name: Upload packaged guest APK and build provenance
        uses: actions/upload-artifact@v4
        with:
          name: byeolharu-android-packaged-guest-step9-debug
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/www-packaged-guest/build-info.json
          if-no-files-found: error
          retention-days: 3

  release-bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 40
    env:
      BYEOLHARU_ANDROID_RELEASE: "1"
      BYEOLHARU_POC_PACKAGED_GUEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - name: Build release Android App Bundle
        working-directory: mobile
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
          npm run release:readiness -- --assert-source-ready
          npm ci --no-audit --no-fund
          npm run packaged-guest:build
          npm run packaged-guest:verify
          npm run android:init
          npm run android:sync
          cd android
          ./gradlew bundleRelease --no-daemon
      - name: Validate final release bundle identity, version, SDK and embedded source
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          node mobile/scripts/check-android-artifact.mjs aab mobile/android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/bundletool.jar"
      - name: Exercise bundle signing with a disposable certificate
        env:
          STORE_PASS: ci-fixture-only
          KEY_PASS: ci-fixture-only
        run: |
          keytool -genkeypair -noprompt -alias fixture -keyalg RSA -validity 3650 -dname CN=CI -keystore "$RUNNER_TEMP/fixture.p12" -storepass:env STORE_PASS
          bash mobile/scripts/sign-aab.sh mobile/android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/fixture.aab" "$RUNNER_TEMP/fixture.p12" fixture
      # A locally installable RELEASE build, intentionally NOT signed with the
      # Play upload key. The ephemeral certificate is created only within CI.
      - name: Compile release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: mobile/android
      - name: Sign installable release APK with disposable test certificate
        env:
          TEST_STORE_PASSWORD: ci-release-apk-test-only
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/byeolharu-test-release.p12"
          keytool -genkeypair -noprompt -alias test-release -keyalg RSA -keysize 3072 \
            -validity 365 -dname "CN=Byeolharu TEST ONLY,OU=CI,O=Development" \
            -storetype PKCS12 -keystore "$keystore" -storepass:env TEST_STORE_PASSWORD \
            -keypass:env TEST_STORE_PASSWORD
          unsigned="mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          aligned="$RUNNER_TEMP/byeolharu-release-aligned.apk"
          signed="mobile/android/app/build/outputs/apk/release/byeolharu-release-test-signed.apk"
          test -s "$unsigned"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -v 4 "$unsigned" "$aligned"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$keystore" --ks-type PKCS12 --ks-key-alias test-release \
            --ks-pass env:TEST_STORE_PASSWORD --key-pass env:TEST_STORE_PASSWORD \
            --out "$signed" "$aligned"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$signed"
          node mobile/scripts/check-android-artifact.mjs apk "$signed" "$ANDROID_HOME/build-tools/36.0.0/aapt"
          sha256sum "$signed"
      - name: Record verified release artifact provenance and checksums
        run: |
          bundle_dir=mobile/android/app/build/outputs/bundle/release
          apk_dir=mobile/android/app/build/outputs/apk/release
          cp mobile/www-packaged-guest/build-info.json "$bundle_dir/"
          cp mobile/www-packaged-guest/build-info.json "$apk_dir/"
          (cd "$bundle_dir" && sha256sum app-release.aab build-info.json > SHA256SUMS)
          (cd "$apk_dir" && sha256sum byeolharu-release-test-signed.apk build-info.json > SHA256SUMS)
      - name: Upload installable release APK (test-signed, not Play)
        uses: actions/upload-artifact@v4
        with:
          name: byeolharu-android-release-apk-test-signed
          path: |
            mobile/android/app/build/outputs/apk/release/byeolharu-release-test-signed.apk
            mobile/android/app/build/outputs/apk/release/build-info.json
            mobile/android/app/build/outputs/apk/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: byeolharu-android-release-unsigned
          path: |
            mobile/android/app/build/outputs/bundle/release/app-release.aab
            mobile/android/app/build/outputs/bundle/release/build-info.json
            mobile/android/app/build/outputs/bundle/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  sign-internal:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.sign_internal
    needs: release-bundle
    runs-on: ubuntu-latest
    environment: play-internal
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - uses: actions/download-artifact@v4
        with:
          name: byeolharu-android-release-unsigned
          path: unsigned
      - name: Verify downloaded unsigned artifact, source and Play version acknowledgement
        env:
          PLAY_MAX_VERSION_CODE: ${{ inputs.highest_play_version_code }}
        run: |
          node --input-type=module -e 'import {assertNewPlayVersion, readAndroidVersion} from "./mobile/scripts/android-release-version.mjs"; assertNewPlayVersion(readAndroidVersion("mobile"), process.env.PLAY_MAX_VERSION_CODE);'
          (cd unsigned && sha256sum --check SHA256SUMS)
          node --input-type=module -e 'import assert from "node:assert/strict"; import {readFileSync} from "node:fs"; import {sourceBuildInfo} from "./mobile/scripts/build-info.mjs"; assert.deepEqual(JSON.parse(readFileSync("unsigned/build-info.json","utf8")), sourceBuildInfo(process.cwd(),true,"release"));'
      - name: Sign verified AAB with Play upload key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          UPLOAD_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          : "${KEYSTORE_B64:?Missing upload keystore}" "${UPLOAD_ALIAS:?Missing upload alias}"
          keyfile=$(mktemp)
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keyfile"
          bash mobile/scripts/sign-aab.sh unsigned/app-release.aab byeolharu-internal.aab "$keyfile" "$UPLOAD_ALIAS"
      - name: Record signed bundle provenance
        run: |
          cp unsigned/build-info.json .
          sha256sum byeolharu-internal.aab build-info.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: byeolharu-play-internal-signed
          path: |
            byeolharu-internal.aab
            build-info.json
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7
