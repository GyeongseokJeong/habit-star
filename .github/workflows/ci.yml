name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:skills
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:db --postgres
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:production
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: pnpm test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
  cloud:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start --exclude storage-api,imgproxy,realtime,studio,edge-runtime,logflare,vector,supavisor
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:db
      - run: pnpm test:e2e:cloud
      - if: always()
        run: pnpm exec supabase stop --no-backup
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cloud-test-results
          path: test-results/
