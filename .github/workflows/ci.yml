name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  # Keep the full quality gate for main, but cancel superseded PR checks.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      cloud_required: ${{ steps.cloud_scope.outputs.required }}
    steps:
      - uses: actions/checkout@v4
      # On PRs with only CSS/layout tests, run the full browser quality gate
      # but skip redundant Supabase integration startup after it passes.
      - name: Determine cloud integration scope
        id: cloud_scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          echo "$changed"
          # Fail open: only skip the cloud suite when changes are clearly
          # isolated from runtime, DB, auth, sync, workflow, and cloud tests.
          if echo "$changed" | grep -Eq '^(app/|components/|lib/|supabase/|scripts/|tests/db-|tests/legacy-import|tests/e2e/cloud[.]spec[.]ts|playwright[.]cloud[.]config[.]ts|package[.]json|pnpm-lock[.]yaml|[.]github/workflows/|next[.]config|middleware|public/sw[.]js)'; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:skills
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:db --postgres
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:production
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: pnpm test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
  cloud:
    runs-on: ubuntu-latest
    needs: verify
    # Full cloud test remains mandatory for main and PRs changing runtime/DB.
    if: needs.verify.outputs.cloud_required == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start --exclude storage-api,imgproxy,realtime,studio,edge-runtime,logflare,vector,supavisor
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:db
      - run: pnpm test:e2e:cloud
      - if: always()
        run: pnpm exec supabase stop --no-backup
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cloud-test-results
          path: test-results/
