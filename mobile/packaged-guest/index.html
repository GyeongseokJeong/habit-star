<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#19242a">
  <title>별하루 — Android 비회원 테스트</title>
  <link rel="stylesheet" href="./app.css">
  <link rel="stylesheet" href="./safe-area.css">
  <script>
    let mode = "system";
    try {
      const stored = localStorage.getItem("byeolharu_v3_theme_mode");
      const legacy = localStorage.getItem("byeolharu_v2_theme")
        ?? localStorage.getItem("byeolharu_v1_theme");
      mode = stored === "light" || stored === "dark" || stored === "system"
        ? stored : legacy === "dark" ? "dark" : "system";
    } catch {
      // Optional local display settings may be unavailable.
    }
    const dark = mode === "dark" ||
      (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.byeolharuTheme = dark ? "dark" : "light";
    document.querySelector('meta[name="theme-color"]')
      ?.setAttribute("content", dark ? "#0C111B" : "#F7F6F2");
  </script>
  <script>
    // A readable fail-safe for fatal JavaScript errors or broken bundled assets.
    // Keep this in the packaged Android shell only (never the website).
    window.__byeolharuStartupReady = false;
    window.__byeolharuStartupErrors = [];
    const reportStartupError = (message) => {
      if (window.__byeolharuStartupReady) return;
      const safe = String(message || "알 수 없는 오류").slice(0, 280);
      window.__byeolharuStartupErrors.push(safe);
      const root = document.getElementById("byeolharu-root");
      if (!root) return;
      root.replaceChildren();
      const panel = document.createElement("section");
      panel.style.cssText = "padding:24px;font-family:system-ui;line-height:1.7;color:#241e2b";
      const title = document.createElement("strong");
      title.textContent = "별하루 실행에 문제가 생겼어요.";
      const detail = document.createElement("p");
      detail.textContent = safe;
      const note = document.createElement("small");
      note.textContent = "테스트용 앱의 실행 오류입니다. 화면을 캡처해 알려주세요. 앱 데이터를 삭제하거나 재설치하지 마세요.";
      panel.append(title,detail,note);
      root.append(panel);
    };
    window.addEventListener("error", event => {
      reportStartupError(event.message || "스크립트 또는 리소스 로딩 오류");
    });
    window.addEventListener("unhandledrejection", event => {
      reportStartupError(event.reason?.message || event.reason || "초기화 중 예외");
    });
    window.addEventListener("DOMContentLoaded", () => {
      window.setTimeout(() => {
        if (!window.__byeolharuStartupReady && !window.__byeolharuStartupErrors.length) {
          reportStartupError("앱 초기화 제한 시간 초과 (15초)");
        }
      }, 15000);
    });
  </script>
  <script defer src="./app.js"></script>
</head>
<body>
  <div id="byeolharu-root"><p style="padding:24px">별하루 준비 중…</p></div>
</body>
</html>
