<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#19242a">
  <title>별하루 · 습관 알림 STEP 5</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background:#19242a; color:#f5f1ed }
    * { box-sizing:border-box }
    body { padding:max(env(safe-area-inset-top),30px) 20px max(env(safe-area-inset-bottom),30px); margin:0 }
    main { max-width:500px; margin:auto }
    h1 { font-size:23px; margin:12px 0 }
    p, small { color:#c9c6d3; line-height:1.6 }
    section { background:#263340; padding:19px; border-radius:18px; margin:20px 0 }
    button { width:100%; min-height:48px; border:0; border-radius:12px; padding:14px; margin:6px 0; font-weight:700; font-size:15px; background:#ded5ef; color:#242137 }
    button.secondary { background:#485365; color:#f6f1fc }
    button:focus-visible { outline:3px solid #e8b971; outline-offset:3px }
    button:disabled { opacity:.55 }
    #status { white-space:pre-wrap; min-height:64px }
    #preview { padding-left:22px; line-height:1.7 }
    .star { color:#e8b971; font-size:30px }
  </style>
</head>
<body><main>
  <div class="star" aria-hidden="true">✦</div>
  <h1>습관 알림 테스트 · STEP 5</h1>
  <p>실제 계정·기록이 아닌 데모 습관 두 개로 반복 요일, 시간, 취소 동작을 확인합니다.</p>
  <section>
    <button id="permission">알림 권한 요청</button>
    <button id="previewButton" class="secondary">예약 일정 미리보기</button>
    <button id="schedule">데모 습관 알림 예약</button>
    <button id="complete" class="secondary">오늘 첫 습관 완료 처리 · 다시 예약</button>
    <button id="pending" class="secondary">예약된 데모 알림 확인</button>
    <button id="cancel" class="secondary">데모 알림 모두 취소</button>
    <p role="status" aria-live="polite" id="status">Android 연결 확인 중…</p>
  </section>
  <section><strong>예정 알림</strong><ol id="preview"></ol></section>
  <small>테스트 앱 전용 알림입니다. 실시간 정시 발송·재부팅·실제 서비스 연결은 아직 보장하지 않습니다. 모든 알림은 수동 조작으로만 예약합니다.</small>
  <script src="./reminder-step5.js" defer></script>
</main></body></html>
