<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#19242a">
  <title>별하루 · 알림 기능 검증</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, "Noto Sans KR", sans-serif; background: #19242a; color: #f5f1ed; }
    body { margin: 0; min-height: 100dvh; padding: max(env(safe-area-inset-top), 32px) 22px max(env(safe-area-inset-bottom), 32px); }
    main { max-width: 500px; margin: 0 auto; }
    h1 { font-size: 24px; margin: 26px 0 8px; }
    p, small { color: #c6c4d2; line-height: 1.7; }
    .star { color: #e8b971; font-size: 32px; }
    .panel { background: #25313d; border-radius: 18px; padding: 18px; margin: 22px 0; }
    button { display: block; width: 100%; border: 0; border-radius: 12px; padding: 15px; margin: 10px 0; background: #ddd4ef; color: #222137; font-size: 15px; font-weight: 700; }
    button.secondary { color: #f2ecfa; background: #485265; }
    button:disabled { opacity: .6; }
    #status { min-height: 52px; white-space: pre-wrap; }
    .subtle { font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="star" aria-hidden="true">✦</div>
    <h1>별하루 알림 테스트</h1>
    <p>이 앱은 별도의 Android 기능 검증 앱입니다. 기존 웹·회원 계정·습관 기록은 읽거나 수정하지 않습니다.</p>
    <section class="panel">
      <button id="permission">1. 알림 권한 확인·요청</button>
      <button id="schedule">2. 30초 후 테스트 알림 예약</button>
      <button id="pending" class="secondary">예약된 테스트 알림 확인</button>
      <button id="cancel" class="secondary">예약된 테스트 알림 취소</button>
      <p role="status" aria-live="polite" id="status">네이티브 플러그인을 확인하는 중…</p>
    </section>
    <small>알림을 예약한 뒤 홈 버튼으로 나가 30초 이상 기다려 보세요. 정확히 30초에 도착한다는 보장은 없습니다. 기기 알림 권한·배터리 절전·제조사 정책에 따라 달라질 수 있습니다.</small>
    <p class="subtle">Play Store 출시용이 아닙니다. 이 화면에서는 정밀 알람 권한을 요청하지 않습니다.</p>
  </main>
  <script src="./notification-poc.js" defer></script>
</body>
</html>
