<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#19242a">
<title>별하루 · STEP 8 Android 통합 테스트</title>
<style>
:root{font-family:system-ui,"Noto Sans KR",sans-serif;color-scheme:dark;background:#19242a;color:#f5f1ed}
*{box-sizing:border-box}
body{margin:0;padding:max(28px,env(safe-area-inset-top)) 20px max(30px,env(safe-area-inset-bottom))}
main{max-width:540px;margin:auto}
h1{font-size:23px;margin:6px 0 10px}
h2{font-size:16px;margin:0 0 14px}
p,small{line-height:1.6;color:#c7c5d1}
small{display:block}
.star{color:#e6b875;font-size:31px}
section{padding:18px;border-radius:18px;background:#263340;margin:16px 0}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0}
.field label{font-size:15px;font-weight:600}
input[type=time]{font:inherit;min-height:46px;background:#18242e;color:#f5f1ed;border:1px solid #677485;border-radius:10px;padding:7px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0 14px}
.days button{padding:9px 0;min-height:44px;background:#435364;color:#fff;font-size:14px}
.days button[aria-pressed=true]{background:#dfd3f1;color:#29223b}
button{display:block;width:100%;min-height:46px;margin:8px 0;padding:11px;border:0;border-radius:12px;background:#ded4ed;color:#202336;font-size:14px;font-weight:700}
button.secondary{background:#475464;color:#f9f6ff}
button:disabled{opacity:.55}
button:focus-visible,input:focus-visible{outline:3px solid #e7ba73;outline-offset:2px}
#status{white-space:pre-wrap;min-height:60px}
.info{color:#e6b875;font-size:13px}
</style>
</head>
<body><main>
<div class="star" aria-hidden="true">✦</div>
<h1>별하루 습관 알림 통합 테스트</h1>
<p>기존 습관 설정 형식으로 Android 알림을 직접 예약·수정·취소합니다. 이 앱은 <strong>독립 데모</strong>이며 운영 계정·기록을 사용하지 않습니다.</p>
<section>
<h2>데모 습관</h2>
<div class="field"><label for="time">💧 물 마시기 · 알림 시간</label><input type="time" id="time" required></div>
<div><strong>반복 요일</strong><div class="days" id="weekdays" role="group" aria-label="반복 요일"></div></div>
<div class="field"><label for="habitEnabled">이 습관의 알림 사용</label><input type="checkbox" id="habitEnabled" checked aria-label="이 습관의 알림 사용"></div>
<button id="permission" class="secondary">알림 권한 확인·요청</button>
<button id="activate">알림 켜기 · 예약 적용</button>
<button id="completed" class="secondary">오늘 실천 완료</button>
<button id="undo" class="secondary">오늘 실천 완료 취소</button>
<button id="pending" class="secondary">현재 예약 확인</button>
<button id="disable" class="secondary">알림 완전히 끄기</button>
<p id="status" role="status" aria-live="polite">Android 연결 확인 중…</p>
<small id="summary" class="info"></small>
</section>
<small>데모 습관·동의 상태는 앱 재시작 시 초기화됩니다. 테스트 중 생성한 알림은 이 앱 패키지 내부에서만 관리합니다. 단말 시간을 변경하거나 권한을 해제한 경우 앱 복귀 후 다시 확인하세요.</small>
<script src="./reminder-step8.js" defer></script>
</main></body></html>
